name: Send Adhkar

on:
  schedule:
    - cron: "30 5 * * *"   # الصباح 06:30 (UTC+1)
    - cron: "0 16 * * *"   # المساء 17:00 (UTC+1)
    - cron: "0 6 * * 5"    # الجمعة 07:00 (UTC+1)
  workflow_dispatch:
    inputs:
      kind:
        description: "morning / evening / friday"
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - friday

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Send
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ github.event.inputs.kind }}
        run: |
          if [ -n "$INPUT_KIND" ]; then KIND="$INPUT_KIND"
          elif [ "$SCHEDULE" = "30 5 * * *" ]; then KIND=morning
          elif [ "$SCHEDULE" = "0 16 * * *" ]; then KIND=evening
          else KIND=friday; fi
          python send.py "$KIND"
